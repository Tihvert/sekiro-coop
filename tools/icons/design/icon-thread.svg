<svg xmlns="http://www.w3.org/2000/svg" id="icon-thread" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="thread-gold" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#f0d68e"></stop><stop offset="0.35" stop-color="#b8923f"></stop><stop offset="0.75" stop-color="#6a4a1c"></stop><stop offset="1" stop-color="#3a2810"></stop>
</linearGradient>
<filter id="thread-blur4" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4.5"></feGaussianBlur></filter>
<filter id="thread-blur1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1"></feGaussianBlur></filter>
<filter id="thread-grime" x="-5%" y="-5%" width="110%" height="110%">
<feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="13" result="n"></feTurbulence>
<feColorMatrix in="n" type="matrix" values="0 0 0 0 0.11  0 0 0 0 0.05  0 0 0 0 0.03  2.3 0 0 0 -1.18" result="d"></feColorMatrix>
<feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="6" result="m"></feTurbulence>
<feColorMatrix in="m" type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.3  0 0 0 0 0.22  2.2 0 0 0 -1.3" result="fade"></feColorMatrix>
<feMerge result="over"><feMergeNode in="fade"></feMergeNode><feMergeNode in="d"></feMergeNode></feMerge>
<feComposite in="over" in2="SourceGraphic" operator="in" result="ov"></feComposite>
<feMerge><feMergeNode in="SourceGraphic"></feMergeNode><feMergeNode in="ov"></feMergeNode></feMerge>
</filter>
<filter id="thread-paint" x="-10%" y="-10%" width="120%" height="120%">
<feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="5" result="w"></feTurbulence>
<feDisplacementMap in="SourceGraphic" in2="w" scale="2.4" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
</filter>
